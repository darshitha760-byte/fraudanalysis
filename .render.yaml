services:
  - type: web
    name: fraud-detection-api
    env: docker
    region: ohio
    plan: standard
    
    # Build configuration
    dockerfile: Dockerfile.render
    dockerContext: ./
    
    # Healthcheck
    healthCheck:
      path: /health
      interval: 30
      timeout: 10
      startPeriod: 20
      retries: 3
    
    # Environment variables (override in dashboard)
    envVars:
      - key: DATABASE_URL
        scope: run
      - key: REDIS_URL
        scope: run
      - key: SECRET_KEY
        scope: run
      - key: ENVIRONMENT
        value: production
        scope: run
      - key: DEBUG
        value: "false"
        scope: run
      - key: API_PORT
        value: "8000"
        scope: run
      - key: PYTHONUNBUFFERED
        value: "1"
        scope: run
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
        scope: run
    
    # Auto-deploy configuration
    autoDeploy: true
    preDeployCommand: |
      python -m alembic upgrade head
